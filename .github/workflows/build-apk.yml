name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Sync Android project
        run: npm run cap:sync

      - name: Allow Gradle wrapper to run
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/debug/app-debug.apk apk/CitiHomesAttendance.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CitiHomesAttendance.apk
          path: apk/CitiHomesAttendance.apk

      - name: Publish APK to Supabase Storage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          URL="${SUPABASE_URL:-https://mnfrbyzdubsgnhxrzuxx.supabase.co}"
          KEY="${SUPABASE_SERVICE_ROLE_KEY:-${SUPABASE_ANON_KEY:-}}"
          if [ -z "$KEY" ]; then
            echo "No Supabase upload key configured. APK artifact was built but not published."
            exit 0
          fi
          curl --fail-with-body \
            --request POST \
            "$URL/storage/v1/object/apk-downloads/CitiHomesAttendance.apk" \
            --header "Authorization: Bearer $KEY" \
            --header "apikey: $KEY" \
            --header "Content-Type: application/vnd.android.package-archive" \
            --header "x-upsert: true" \
            --data-binary "@apk/CitiHomesAttendance.apk"
