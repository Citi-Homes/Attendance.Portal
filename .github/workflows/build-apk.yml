name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.vfs.watch=false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Sync Android project
        run: npm run cap:sync

      - name: Allow Gradle wrapper to run
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        timeout-minutes: 12
        run: |
          set +e
          ./gradlew --no-daemon assembleDebug --stacktrace --warning-mode all 2>&1 | tee ../gradle-build.log
          status=${PIPESTATUS[0]}
          echo "$status" > ../gradle-status.txt
          exit "$status"

      - name: Upload Gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log

      - name: Prepare APK
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/debug/app-debug.apk apk/CitiHomesAttendance.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CitiHomesAttendance.apk
          path: apk/CitiHomesAttendance.apk
